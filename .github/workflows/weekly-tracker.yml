name: Microsoft Security Weekly Tracker

on:
  schedule:
    - cron: '0 7 * * 1'   # Every Monday at 07:00 UTC
    - cron: '0 7 * * 4'   # Every Thursday at 07:00 UTC (catches Patch Tuesday)
  workflow_dispatch:       # Manual trigger from GitHub UI

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Required to push the generated report

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Microsoft Security Tracker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ms_threat_tracker.py

      - name: Commit and Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔷 Add Microsoft security report $(date +'%Y-%m-%d')" && git push)
